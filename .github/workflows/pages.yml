name: Publish website to GitHub Pages

on:
  push:
    branches: [master]
    # Markdown never reaches the build (README, NOTICE, docs/), so skip those commits.
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [master]
    # Markdown never reaches the build (README, NOTICE, docs/), so skip those commits.
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build and validate static website
        env:
          # Read-only token for the build-time GitHub stars/forks lookup (avoids API rate limits).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build
          npm run check
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - name: Build and validate static website
        env:
          # Pages can report an HTTP base_url before HTTPS enforcement is enabled.
          # Keep metadata on HTTPS while retaining the actual host and project path.
          SITE_URL: https://${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build
          npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live sitemap and crawlable pages
        env:
          SITE_URL: https://${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}
        run: npm run check:live
