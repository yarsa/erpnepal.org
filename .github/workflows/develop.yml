name: Develop build check

on:
  push:
    branches: [develop]
    # Markdown never reaches the build (README, NOTICE, docs/), so skip those commits.
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [develop]
    # Markdown never reaches the build (README, NOTICE, docs/), so skip those commits.
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build and validate
        env:
          # Read-only token for the build-time GitHub stars/forks lookup (avoids API rate limits).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build
          npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
